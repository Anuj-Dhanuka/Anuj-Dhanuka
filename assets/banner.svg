<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title">
  <title id="title">Anuj Dhanuka, Frontend and React Native Developer</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e0b4b"/>
      <stop offset="0.6" stop-color="#2e1065"/>
      <stop offset="1" stop-color="#500724"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ec4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <circle cx="180" cy="40" r="260" fill="url(#glowA)"/>
    <circle cx="1040" cy="280" r="280" fill="url(#glowB)"/>

    <!-- Orbit rings, echoing the portfolio hero -->
    <g fill="none" stroke="#c4b5fd" stroke-opacity="0.16">
      <circle cx="1000" cy="150" r="70"/>
      <circle cx="1000" cy="150" r="115" stroke-dasharray="4 8"/>
      <circle cx="1000" cy="150" r="165"/>
    </g>
    <circle cx="1000" cy="150" r="9" fill="url(#accent)"/>
    <circle cx="1070" cy="150" r="5" fill="#f9a8d4"/>
    <circle cx="918" cy="70" r="4" fill="#c4b5fd"/>
    <circle cx="1125" cy="248" r="4" fill="#f472b6"/>

    <!-- React-style atom, the shared root of the web and mobile stack -->
    <g transform="translate(1000 150)" fill="none" stroke="#f9a8d4" stroke-opacity="0.55" stroke-width="2">
      <ellipse rx="40" ry="15"/>
      <ellipse rx="40" ry="15" transform="rotate(60)"/>
      <ellipse rx="40" ry="15" transform="rotate(120)"/>
    </g>

    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
      <text x="72" y="104" fill="#c4b5fd" font-size="18" font-weight="600" letter-spacing="1">Hi, I'm</text>
      <text x="70" y="160" fill="#ffffff" font-size="56" font-weight="800">Anuj Dhanuka</text>
      <rect x="72" y="178" width="96" height="4" rx="2" fill="url(#accent)"/>
      <text x="72" y="220" fill="#ede9fe" font-size="24" font-weight="600">Frontend &amp; React Native Developer</text>
      <text x="72" y="254" fill="#c4b5fd" font-size="17">React · React Native · Next.js · TypeScript</text>
    </g>
  </g>
</svg>
